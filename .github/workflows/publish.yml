name: Publish VS Code extension

on:
  pull_request:
    types:
      - closed
    branches:
      - release

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 26.13.0
          cache: true
          run-install: false
      - run: pnpm install --frozen-lockfile
      - name: Test extension
        run: pnpm --filter vscode-spacefn test
      - name: Compile extension
        run: pnpm --filter vscode-spacefn run compile
      - name: Publish extension
        working-directory: packages/vscode-spacefn
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc
