name: Publish VS Code extension

on:
  pull_request:
    types:
      - closed
    branches:
      - release

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test extension
        run: pnpm --filter vscode-spacefn test
      - name: Compile extension
        run: pnpm --filter vscode-spacefn run compile
      - name: Prepare extension package
        run: |
          mkdir -p "$RUNNER_TEMP/vscode-spacefn"
          rsync -a --exclude=node_modules packages/vscode-spacefn/ "$RUNNER_TEMP/vscode-spacefn/"
          cd "$RUNNER_TEMP/vscode-spacefn"
          # Workspace and catalog devDependencies are already bundled and npm can't resolve them.
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); delete p.devDependencies; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
          npm install --omit=dev --package-lock=false
      - name: Publish extension
        working-directory: ${{ runner.temp }}/vscode-spacefn
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc
