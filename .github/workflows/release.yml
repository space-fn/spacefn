name: Release

on:
  push:
    branches:
      - release

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: write # Required for creating git tags

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r test

      - run: pnpm fmt:check && pnpm lint

      - name: Publish and tag
        run: |
          tags=""
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ]; then
              name=$(node -p "require('./package.json').name" --prefix "$dir")
              version=$(node -p "require('./package.json').version" --prefix "$dir")

              # Check if this version already exists on npm
              if npm view "$name@$version" version 2>/dev/null; then
                echo "⏭️  $name@$version already published, skipping"
              else
                echo "📦 Publishing $name@$version"
                (cd "$dir" && npm publish --provenance --access public)

                # Collect tag
                tag="${name}@${version}"
                echo "🏷️  Tagging $tag"
                tags="$tags $tag"
              fi
            fi
          done

          # Push all tags at once
          if [ -n "$tags" ]; then
            for tag in $tags; do
              git tag "$tag"
            done
            echo "🚀 Pushing tags:$tags"
            git push origin --tags
          fi
