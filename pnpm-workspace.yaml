packages:
  - "packages/*"
  - "playground"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261012.1-beta
  - wrangler@4.151.1
  - "@cloudflare/build-output-utils@0.9.3"
  - "@cloudflare/config@0.27.0"
  - "@cloudflare/runtime-types@0.1.12"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.1"
  - cf@1.0.0-beta.18
  - spacefn@0.1.1
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
